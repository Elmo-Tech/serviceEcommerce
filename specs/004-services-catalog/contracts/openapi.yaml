        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: adminUpdateServiceSpecification
      summary: Update one specification
      tags:
      - Admin Specifications
      security:
      - bearerAuth: []
      x-permission: service-specifications.update
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - *id005
      - *id006
      responses:
        '200':
          description: Specification updated
          content:
            application/json:
