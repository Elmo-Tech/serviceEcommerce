  /admin/auth/verify-forgot-password-code:
    post:
      operationId: adminAuthVerifyForgotPasswordCode
      tags:
      - Admin Authentication
      summary: Verify a recovery code and issue one Reset Token
      description: Accepts normalized email and an exact six-digit code. Wrong, expired, consumed, or attempt-limited
        codes use PASSWORD_RESET_CODE_INVALID. Successful verification consumes the code and returns one Reset Token
        valid for 600 seconds.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyForgotPasswordCodeRequest'
