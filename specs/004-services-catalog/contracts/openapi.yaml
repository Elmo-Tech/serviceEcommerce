        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Only the documented public filters are accepted. No client-controlled sort parameter exists;
        internal order is created_at DESC, id DESC.
  /public/services/{serviceSlug}:
    get:
      operationId: publicShowService
      summary: Show one active public service by localized slug
      tags:
      - Public Services
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ServiceSlug'
      responses:
        '200':
          description: Localized public service detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServiceDetailSuccess'
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/VaryAcceptLanguage'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Feature 001 Sanctum Bearer access token.
  headers:
    ContentLanguage:
      description: Resolved response locale.
      schema:
        type: string
        enum:
        - ar
        - en
    VaryAcceptLanguage:
      description: Cache variance includes Accept-Language.
      schema:
        type: string
        examples:
        - Accept-Language
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - ar
        - en
        default: ar
      description: Controls localized messages and projections where the contract returns one locale.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageAdmin:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    PerPagePublic:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    ServiceFilterSearch:
      name: filter[search]
      in: query
      required: false
