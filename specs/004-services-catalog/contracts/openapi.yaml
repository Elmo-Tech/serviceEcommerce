  /public/services:
    get:
      operationId: publicListServices
      summary: List active public services
      tags:
      - Public Services
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPagePublic'
      - $ref: '#/components/parameters/ServiceFilterSearch'
      - $ref: '#/components/parameters/PublicFilterCategory'
      - $ref: '#/components/parameters/PublicFilterSubcategory'
      - $ref: '#/components/parameters/PublicFilterPriceFrom'
      - $ref: '#/components/parameters/PublicFilterPriceTo'
      - $ref: '#/components/parameters/PublicFilterIsAvailable'
      responses:
        '200':
          description: Paginated localized service list
          content:
            application/json:
              schema:
