  /admin/auth/forgot-password:
    post:
      operationId: adminAuthForgotPassword
      tags:
      - Admin Authentication
      summary: Start the Forgot Password workflow
      description: Returns the same enumeration-safe 200 success for an eligible successful delivery, an unknown
        email, and an inactive Administrator. Validation remains 422, throttling remains 429, and eligible synchronous
        mail transport failure remains 503.
