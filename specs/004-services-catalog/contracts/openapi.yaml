                $ref: '#/components/schemas/SpecificationListSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: adminCreateServiceSpecification
      summary: Create one specification
      tags:
      - Admin Specifications
      security:
      - bearerAuth: []
      x-permission: service-specifications.create
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - *id005
      responses:
        '201':
          description: Specification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificationDetailSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificationCreate'
  /admin/services/{service}/specifications/{specification}:
    get:
      operationId: adminShowServiceSpecification
      summary: Show one specification
      tags:
      - Admin Specifications
      security:
