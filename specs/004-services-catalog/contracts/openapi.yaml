openapi: 3.1.0
info:
  title: Service Commerce Backend — Feature 004 Services Catalog
  version: 1.1.0
  description: Canonical contract for Feature 004. Contains exactly 26 protected Admin operations and 2 public read
    operations. Existing Feature 003 category/subcategory DELETE contracts must additionally document CATEGORY_HAS_SERVICES
    and SUBCATEGORY_HAS_SERVICES conflicts.
servers:
- url: https://api.example-backend.net/api/v1
tags:
- name: Admin Services
- name: Admin Specifications
- name: Admin Order Fields
- name: Admin Pricing Options
- name: Admin Media
- name: Public Services
x-feature-003-contract-updates:
  categoryDeleteConflict: CATEGORY_HAS_SERVICES
  subcategoryDeleteConflict: SUBCATEGORY_HAS_SERVICES
paths:
  /admin/services:
    get:
      operationId: adminListServices
      summary: List services for administrators
      tags:
      - Admin Services
      security:
      - bearerAuth: []
      x-permission: services.view
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPageAdmin'
      - $ref: '#/components/parameters/ServiceFilterSearch'
      - $ref: '#/components/parameters/ServiceFilterCategoryId'
      - $ref: '#/components/parameters/ServiceFilterSubcategoryId'
      - $ref: '#/components/parameters/ServiceFilterPriceType'
      - $ref: '#/components/parameters/ServiceFilterIsActive'
      - $ref: '#/components/parameters/ServiceFilterIsAvailable'
      - $ref: '#/components/parameters/ServiceFilterTrashed'
      - $ref: '#/components/parameters/ServiceSortAdmin'
      responses:
        '200':
          description: Paginated localized Admin service list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceListSuccess'
        '401': &id001
          $ref: '#/components/responses/Unauthenticated'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '429': &id003
          $ref: '#/components/responses/RateLimited'
        '500': &id004
          $ref: '#/components/responses/InternalError'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Only the documented filters and sorts are accepted. Unsupported query properties are rejected
        by the established Query Builder contract.
    post:
      operationId: adminCreateService
      summary: Create a service with optional nested records and media
      tags:
      - Admin Services
      security:
      - bearerAuth: []
      x-permission: services.create
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceDetailSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateServiceRequest'
      x-conditional-permissions:
        specifications: service-specifications.create
        orderFields: service-order-fields.create
        pricingOptions: service-pricing-options.create
        media: service-media.create
      description: Requires services.create. Each submitted nested collection additionally requires its matching
        x-conditional-permissions entry. The request uses multipart bracket notation and does not accept a JSON
        payload field.
  /admin/services/{service}:
    get:
      operationId: adminShowService
      summary: Show one service
      tags:
      - Admin Services
      security:
      - bearerAuth: []
      x-permission: services.view
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Admin service detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceDetailSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: adminUpdateService
      summary: Update service-level fields only
      tags:
      - Admin Services
      security:
      - bearerAuth: []
      x-permission: services.update
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceDetailSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateServiceRequest'
    delete:
      operationId: adminDeleteService
      summary: Soft delete a service
      tags:
      - Admin Services
      security:
      - bearerAuth: []
      x-permission: services.delete
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service soft deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/services/{service}/restore:
    post:
      operationId: adminRestoreService
      summary: Restore a soft-deleted service as inactive
      tags:
      - Admin Services
      security:
      - bearerAuth: []
      x-permission: services.restore
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceDetailSuccess'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/services/{service}/specifications:
    get:
      operationId: adminListServiceSpecifications
      summary: List service specifications
      tags:
      - Admin Specifications
      security:
      - bearerAuth: []
      x-permission: service-specifications.view
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
