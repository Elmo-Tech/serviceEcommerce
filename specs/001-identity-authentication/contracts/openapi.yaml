            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCodeSuccess'
        '422':
          $ref: '#/components/responses/ValidationOrPasswordResetCodeInvalid'
  /admin/auth/reset-password:
    post:
      operationId: adminAuthResetPassword
      tags:
      - Admin Authentication
      summary: Reset the Administrator password
      description: Uses normalized email and a one-time Reset Token. A structurally valid but unusable Reset Token
        uses PASSWORD_RESET_TOKEN_INVALID. Success atomically consumes the workflow, changes the password, revokes
        all sessions, and returns no new auth token.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
