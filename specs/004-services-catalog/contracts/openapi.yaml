      security:
      - bearerAuth: []
      x-permission: service-specifications.delete
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - *id005
      - *id006
      responses:
        '200':
          description: Specification soft deleted
          content:
            application/json:
